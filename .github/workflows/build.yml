name: Build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish the package to nuget.org'
        type: boolean
        default: false

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  PROJECT: src/KD.Avalonia.Rice/KD.Avalonia.Rice.csproj
  PACKAGE_DIR: ${{ github.workspace }}/artifacts/packages

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Nerdbank.GitVersioning needs the full history to compute the git height

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore KD.Avalonia.Rice.slnx

      - name: Build
        run: dotnet build KD.Avalonia.Rice.slnx -c Release --no-restore -p:ContinuousIntegrationBuild=true

      - name: Pack
        run: dotnet pack ${{ env.PROJECT }} -c Release --no-build -o ${{ env.PACKAGE_DIR }}

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: packages
          path: |
            ${{ env.PACKAGE_DIR }}/*.nupkg
            ${{ env.PACKAGE_DIR }}/*.snupkg
          if-no-files-found: error

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish)
    runs-on: ubuntu-latest
    permissions:
      id-token: write # required for nuget.org trusted publishing (OIDC)
    steps:
      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          name: packages
          path: packages

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      # Exchanges the GitHub OIDC token for a short-lived nuget.org API key (trusted publishing).
      - name: NuGet login
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      # The .snupkg symbol packages are pushed automatically next to their .nupkg.
      - name: Push to nuget.org
        run: >
          dotnet nuget push "packages/*.nupkg"
          --api-key ${{ steps.login.outputs.NUGET_API_KEY }}
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate
